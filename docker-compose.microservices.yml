x-server-common: &server-common
  build:
    context: ./server
    dockerfile: Dockerfile
  working_dir: /app
  init: true
  env_file:
    - ./server/.env
  environment:
    DB_HOST: mysql
    DB_PORT: 3306
    DB_DIALECT: mysql
    BLOCKCHAIN_RPC_URL: http://hardhat:8545
    BLOCKCHAIN_CHAIN_ID: 31337
    FAIL2BAN_URL: http://fail2ban-service:5000
    CONTRACT_ADDRESS: 0x5FbDB2315678afecb367f032d93F642f64180aa3
    BLOCKCHAIN_CONTRACT_ADDRESS: 0x5FbDB2315678afecb367f032d93F642f64180aa3
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  networks:
    - app-net
    - edge-net
  depends_on:
    mysql:
      condition: service_healthy
    deploy-contract:
      condition: service_completed_successfully

x-service-healthcheck: &service-healthcheck
  healthcheck:
    test: ["CMD-SHELL", "node -e \"const p=process.env.PORT; if(!p){process.exit(1)}; require('http').get({hostname:'127.0.0.1',port:Number(p),path:'/health'},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1));\""]
    interval: 10s
    timeout: 5s
    retries: 10
    start_period: 20s

services:
  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: game_blockchain
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app-net

  hardhat:
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file:
      - ./server/.env
    command: npx hardhat node --hostname 0.0.0.0 --port 8545
    ports:
      - "127.0.0.1:8545:8545"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').request({hostname:'127.0.0.1',port:8545,method:'POST',headers:{'Content-Type':'application/json'}},r=>process.exit(0)).on('error',()=>process.exit(1)).end(JSON.stringify({jsonrpc:'2.0',method:'eth_chainId',params:[],id:1}))\""]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - app-net
      - edge-net

  deploy-contract:
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file:
      - ./server/.env
    environment:
      BLOCKCHAIN_RPC_URL: http://hardhat:8545
      CONTRACT_ADDRESS: 0x5FbDB2315678afecb367f032d93F642f64180aa3
      BLOCKCHAIN_CONTRACT_ADDRESS: 0x5FbDB2315678afecb367f032d93F642f64180aa3
    command: npx hardhat run scripts/deploy-contract.js --network localhost
    depends_on:
      hardhat:
        condition: service_healthy
    restart: "no"
    networks:
      - app-net

  auth-service:
    <<: [*server-common, *service-healthcheck]
    command: npm run start:auth
    ports:
      - "127.0.0.1:4001:4001"
    environment:
      AUTH_SERVICE_PORT: 4001
      PORT: 4001
      FAIL2BAN_URL: http://fail2ban-service:5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DIALECT: mysql
      BLOCKCHAIN_RPC_URL: http://hardhat:8545
      BLOCKCHAIN_CHAIN_ID: 31337
      CONTRACT_ADDRESS: 0x5FbDB2315678afecb367f032d93F642f64180aa3
      BLOCKCHAIN_CONTRACT_ADDRESS: 0x5FbDB2315678afecb367f032d93F642f64180aa3

  user-service:
